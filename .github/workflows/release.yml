name: Release

# Run by hand only: Actions -> Release -> Run workflow on main. Nothing fires on
# a push or a merge. The run ends in a DRAFT release whose tag does not exist
# yet; publishing it (which creates the tag) is the owner's act.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

# Nothing by default. Each job asks for exactly what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # list and delete draft releases (drafts are visible only with push access)
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Compute the next version from the last published release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          LAST="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | sed -n 's/^v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V | tail -n1)"
          LAST="${LAST:-0.0.0}"
          IFS=. read -r MA MI PA <<<"$LAST"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          echo "last published: $LAST -> next: $MA.$MI.$PA"
          echo "version=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"

      - name: Delete older drafts, so only one candidate exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft) | .id'); do
            echo "deleting draft $id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

  build:
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Into this checkout only; nothing is committed.
      - name: Stamp the version
        shell: bash
        run: |
          set -euo pipefail
          # First `version =` line only (the [package] one); portable across runners.
          perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/ if !$done && /^version = / && ($done = 1)' Cargo.toml
          grep '^version' Cargo.toml

      # No cache restore, deliberately: a branch's caches are writable by any
      # workflow on that branch.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check the binary reports exactly the stamped version
        shell: bash
        run: |
          set -euo pipefail
          BUILT="$("target/${{ matrix.target }}/release/hello-sandbox" --version)"
          WANT="hello-sandbox $VERSION"
          echo "built: '$BUILT' want: '$WANT'"
          [[ "$BUILT" == "$WANT" ]] || { echo "version mismatch" >&2; exit 1; }

      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hello-sandbox" "dist/hello-sandbox-${{ matrix.target }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  draft:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore keyless signing via this workflow's OIDC identity
      attestations: write # persist the attestation
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staged
          pattern: dist-*
          merge-multiple: true

      - name: Checksum
        working-directory: staged
        run: |
          sha256sum hello-sandbox-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum SHA256SUMS

      - name: Attest SHA256SUMS
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: staged/SHA256SUMS

      - name: Create the draft (the tag is not created)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "hello-sandbox v$VERSION" \
            --notes "Test fixture. Built from $GITHUB_REF at $GITHUB_SHA by run $GITHUB_RUN_ID. Attestation: ${{ steps.attest.outputs.attestation-url }}" \
            staged/*
          echo "built commit: $GITHUB_SHA ref: $GITHUB_REF"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "UNEXPECTED: tag v$VERSION exists" >&2; exit 1
          fi
          echo "tag v$VERSION does not exist yet, as intended"
